name: 发布到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: 验证并构建游戏
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7.0.1
      - name: 安装 Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: 安装锁定的依赖
        run: npm ci
      - name: 验证游戏规则
        run: npm test
      - name: 静态检查
        run: npm run lint
      - name: 构建 Pages 版本
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    name: 发布游戏
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 配置 Pages
        uses: actions/configure-pages@v6.0.0
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
